<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kandang Ayam Petelur</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="komponen.css">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="responsif.css">
</head>
<body>

<div class="page">

<header>
  <div class="baris-atas">
    <h1 id="judul-halaman">Kandang Ayam Petelur</h1>
    <nav aria-label="Navigasi utama">
      <ul>
        <li><a href="#profil">Profil</a></li>
        <li><a href="#kandang">Kandang</a></li>
        <li><a href="#kontak">Kontak</a></li>
      </ul>
    </nav>
    <input type="checkbox" id="tema" class="pengalih-tema">
    <label for="tema" class="tombol-tema">Tema gelap</label>
  </div>
</header>

<main class="isi">

  <section id="profil" class="sisi">
    <h2>Profil Kandang</h2>
    <p id="teks-profil"></p>
  </section>

  <section id="galeri" class="utama">
    <h2>Galeri Kandang</h2>
    <div class="galeri" id="wadah-galeri"></div>
    <figure class="foto">
      <img src="gambar.webp" alt="Baris ayam petelur di dalam kandang dengan lampu dan tempat pakan otomatis">
      <figcaption>Kandang ayam petelur, baris baterai dengan tempat pakan otomatis.</figcaption>
    </figure>
  </section>

  <div class="bawah">

    <section id="kandang">
      <h2>Data Kandang</h2>
      <div class="tabel-bungkus">
        <table class="tabel-kandang">
          <thead>
            <tr>
              <th>Kandang</th>
              <th>Jenis Ayam</th>
              <th>Jumlah</th>
              <th>Produksi Telur</th>
            </tr>
          </thead>
          <tbody id="isi-tabel"></tbody>
        </table>
      </div>
    </section>

    <section id="kontak">
      <h2>Hubungi Kami</h2>
      <form action="#" method="post">
        <div class="form-kolom">
          <label for="nama">Nama</label>
          <input id="nama" name="nama" type="text" required>
          <span class="pesan-galat">Nama wajib diisi.</span>
        </div>
        <div class="form-kolom">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
          <span class="pesan-galat">Masukkan email yang benar.</span>
        </div>
        <div class="form-kolom">
          <label for="telepon">Telepon</label>
          <input id="telepon" name="telepon" type="tel" inputmode="tel">
        </div>
        <div class="form-kolom">
          <label for="kebutuhan">Kebutuhan</label>
          <select id="kebutuhan" name="kebutuhan" required>
            <option value="" disabled selected hidden>Pilih kebutuhan…</option>
            <option value="telur">Beli Telur</option>
            <option value="pullet">Beli Bibit Ayam</option>
            <option value="pakan">Tanya Pakan</option>
          </select>
          <span class="pesan-galat">Pilih salah satu kebutuhan.</span>
        </div>
        <div class="form-kolom">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="4" required></textarea>
          <span class="pesan-galat">Pesan tidak boleh kosong.</span>
        </div>
        <button type="submit">Kirim</button>
      </form>
    </section>

  </div>

</main>

<footer>
  <p id="teks-footer"></p>
</footer>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
